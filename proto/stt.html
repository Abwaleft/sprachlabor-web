<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo STT · Sprachlabor</title>
<link rel="stylesheet" href="../style.css">
<style>
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  pre { white-space: pre-wrap; font-size: .8rem; background: var(--surface-2); padding: 10px; border-radius: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  select { padding: 8px; border-radius: 8px; max-width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Prototipo: reconocimiento de voz en el navegador</h1>
  <p class="muted small">transformers.js (ONNX, WASM/WebGPU). Modelos: wav2vec2 alemán exportado de la PC (literal, no reordena)
    y Whisper tiny/base multilingüe (más chico, pero corrige). Audio: tus grabaciones reales o un archivo.</p>

  <section class="card">
    <div class="row">
      <label>Modelo <select id="modelo">
        <option value="wav2vec2-de">wav2vec2 alemán int8 (local, ~300 MB)</option>
        <option value="Xenova/whisper-tiny">Xenova/whisper-tiny (~40 MB)</option>
        <option value="Xenova/whisper-base">Xenova/whisper-base (~75 MB)</option>
      </select></label>
      <label>Motor <select id="device"><option value="wasm">wasm</option><option value="webgpu">webgpu</option></select></label>
    </div>
    <div class="row">
      <button class="btn" id="rec">🎙 Grabar 15 s con el micrófono</button>
      <span id="rec-st" class="muted small"></span>
    </div>
    <div class="row" id="fila-grab">
      <label>Grabación <select id="grab"></select></label>
      <input type="file" id="archivo" accept="audio/*">
    </div>
    <div class="row">
      <button class="btn primary" id="run">Cargar modelo y transcribir</button>
      <button class="btn" id="run-todas">Transcribir las 4 grabaciones</button>
      <span id="st" class="muted small"></span>
    </div>
    <div id="out"></div>
  </section>

  <section class="card">
    <h2>Resultados</h2>
    <pre id="res">(todavía nada)</pre>
    <button class="btn sm" id="copiar">Copiar resultados</button>
  </section>
</main>
<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";
env.allowLocalModels = true;
env.allowRemoteModels = true;
env.localModelPath = new URL("../proto-data/models/", location.href).pathname;
env.useBrowserCache = true;

const $ = (s) => document.querySelector(s);
const res = { ua: navigator.userAgent, cores: navigator.hardwareConcurrency, memoria_gb: navigator.deviceMemory, webgpu: !!navigator.gpu, modelos: {} };
window.__res = res;
const show = () => { $("#res").textContent = JSON.stringify(res, null, 1); };
$("#copiar").onclick = () => navigator.clipboard.writeText(JSON.stringify(res, null, 1));

// Las grabaciones de prueba solo existen en el servidor local de la PC (data/proto); en GitHub Pages no hay.
const GRABS = ["sprechen_20261110_112732_45308a.ogg", "sprechen_20261110_113820_5fb3b4.ogg", "sprechen_20261110_115552_57c6e2.ogg", "sprechen_20261111_221758_0a0a84.ogg"];
let local = false;
try { local = (await fetch("../proto-data/recordings/" + GRABS[0], { method: "HEAD" })).ok; } catch { local = false; }
if (local) $("#grab").innerHTML = GRABS.map((g) => `<option value="${g}">${g}</option>`).join("");
else {
  $("#fila-grab").querySelector("label").hidden = true;
  $("#run-todas").hidden = true;
  $("#modelo").querySelector('[value="wav2vec2-de"]').disabled = true;
  $("#modelo").value = "Xenova/whisper-base";
}
let grabado = null;
$("#rec").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.start();
    $("#rec").disabled = true;
    for (let s = 15; s > 0; s--) { $("#rec-st").textContent = `grabando… ${s} s (hablá en alemán)`; await new Promise((r) => setTimeout(r, 1000)); }
    await new Promise((r) => { rec.onstop = r; rec.stop(); });
    stream.getTracks().forEach((t) => t.stop());
    grabado = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
    $("#rec-st").innerHTML = `listo (${Math.round(grabado.size / 1024)} kB) <button class="btn sm" id="oir">▶</button>`;
    $("#oir").onclick = () => new Audio(URL.createObjectURL(grabado)).play();
  } catch (e) { $("#rec-st").textContent = "micrófono: " + (e.message || e); }
  $("#rec").disabled = false;
};

async function decodificar(blob) {
  const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 16000);
  const buf = await new AudioContext().decodeAudioData(await blob.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();
  const r = await off.startRendering();
  void ctx;
  return { audio: r.getChannelData(0), segundos: Math.round(buf.duration * 10) / 10 };
}

const pipes = {};
async function cargar(modelo, device) {
  const key = `${modelo}@${device}`;
  if (pipes[key]) return pipes[key];
  const t = performance.now();
  const antes = performance.getEntriesByType("resource").length;
  const p = await pipeline("automatic-speech-recognition", modelo, {
    dtype: "q8", device,
    progress_callback: (x) => { if (x.status === "progress") $("#st").textContent = `bajando ${x.file}: ${Math.round(x.progress || 0)} %`; },
  });
  const bytes = performance.getEntriesByType("resource").slice(antes).reduce((a, e) => a + (e.transferSize || e.encodedBodySize || 0), 0);
  res.modelos[key] = res.modelos[key] || {};
  res.modelos[key].carga_ms = Math.round(performance.now() - t);
  res.modelos[key].descarga_mb = Math.round(bytes / 1e5) / 10;
  res.modelos[key].transcripciones = [];
  pipes[key] = p;
  show();
  return p;
}

async function transcribir(nombre, blob) {
  const modelo = $("#modelo").value;
  const device = $("#device").value;
  const key = `${modelo}@${device}`;
  $("#st").textContent = "cargando modelo…";
  const p = await cargar(modelo, device);
  $("#st").textContent = "decodificando audio…";
  const { audio, segundos } = await decodificar(blob);
  $("#st").textContent = `transcribiendo ${nombre} (${segundos} s)…`;
  const t = performance.now();
  const opts = modelo.includes("whisper") ? { language: "german", task: "transcribe", chunk_length_s: 30 } : {};
  const r = await p(audio, opts);
  const ms = Math.round(performance.now() - t);
  const texto = (r.text || "").trim();
  res.modelos[key].transcripciones.push({ archivo: nombre, segundos_audio: segundos, ms, rtf: Math.round(ms / segundos / 10) / 100, texto });
  $("#out").insertAdjacentHTML("beforeend", `<p><b>${modelo}</b> · ${nombre} · ${ms} ms (${segundos} s de audio)<br>${texto}</p>`);
  $("#st").textContent = "listo";
  show();
}

async function blobDe(nombre) {
  const r = await fetch(`../proto-data/recordings/${nombre}`);
  if (!r.ok) throw new Error(`no encuentro ${nombre}`);
  return r.blob();
}

$("#run").onclick = async () => {
  $("#run").disabled = true;
  try {
    const f = $("#archivo").files[0];
    if (f) await transcribir(f.name, f);
    else if (grabado) await transcribir("microfono", grabado);
    else if (local) await transcribir($("#grab").value, await blobDe($("#grab").value));
    else throw new Error("grabá algo con el micrófono o elegí un archivo");
  } catch (e) { $("#st").textContent = "falló: " + (e.message || e); res.error = String(e.message || e); show(); }
  $("#run").disabled = false;
};
$("#run-todas").onclick = async () => {
  $("#run-todas").disabled = true;
  try {
    for (const g of GRABS) await transcribir(g, await blobDe(g));
  } catch (e) { $("#st").textContent = "falló: " + (e.message || e); res.error = String(e.message || e); show(); }
  $("#run-todas").disabled = false;
};
show();
</script>
</body>
</html>
